plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kkukky.tabonetouch'
    compileSdk 34

    defaultConfig {
        applicationId "com.kkukky.tabonetouch"
        minSdk 24
        targetSdk 34
        versionCode 10
        versionName "1.5.1"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
