name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Tab_One_Touch.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Tab_One_Touch-apk
          path: Tab_One_Touch.apk

      - name: Publish release (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Tab_One_Touch.apk \
            --title "Tab_One_Touch" \
            --notes "Debug-signed APK. Install on the tablet and allow unknown sources if asked." \
            --target "${{ github.sha }}"
