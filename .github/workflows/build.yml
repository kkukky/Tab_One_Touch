name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Name APK with version
        id: ver
        run: |
          V=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          echo "v=$V" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk "Tab_One_Touch_v${V}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Tab_One_Touch_v${{ steps.ver.outputs.v }}-apk
          path: Tab_One_Touch_v${{ steps.ver.outputs.v }}.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.v }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release delete "v${V}" --cleanup-tag --yes || true
          gh release create "v${V}" "Tab_One_Touch_v${V}.apk" \
            --title "Tab_One_Touch v${V}" \
            --notes "Debug-signed APK v${V}. Install on the tablet and allow unknown sources if asked." \
            --target "${{ github.sha }}" --latest
